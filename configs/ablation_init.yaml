# Ablation: how much does the MultipleNEH start contribute to SA?
# SA from MultipleNEH against SA from a random permutation, everything else equal.
# Three Big testbed sizes, 5 instances per size: 150 runs, about 15 min with 4 workers.
output_dir: results/ablation_init
workers: 4

instances:
  dir: data/COSP_Flow_Shop
  ids: [10, 11, 12, 13, 14]
  groups:
    - {n: [10, 20, 50], o: [5], m: [3]}

budget:
  max_full_evals: 190000

seeds: [1, 2, 3, 4, 5]

algorithms:
  SA (NEH start):
    type: sa
    params: {init: neh, p0: 0.3, t_ratio: 0.001, p_insert: 0.6, p_swap: 0.3}
  SA (random start):
    type: sa
    params: {init: random, p0: 0.3, t_ratio: 0.001, p_insert: 0.6, p_swap: 0.3}
