# Quick end-to-end check of the pipeline (about 2 minutes). Not an experiment.
output_dir: results/smoke
workers: 1

instances:
  dir: data/COSP_Flow_Shop
  ids: [10, 11]        # ids 10-29 are the paper's comparison instances
  groups:              # every combination of n, o, m inside a group
    - {n: [3], o: [2, 4], m: [3]}
    - {n: [10], o: [2, 5], m: [3]}

budget:
  time_factor: 0.12    # time limit [s] = n * o * m / 2 * time_factor (paper: 0.12)

seeds: [1, 2]

algorithms:
  SA:
    type: sa
    params: {init: neh, p0: 0.3, t_ratio: 0.001, p_insert: 0.6, p_swap: 0.3}
  IGA-String:
    type: iga_string
    params: {gamma: 20000, z: 2.0}   # paper, Table 8
