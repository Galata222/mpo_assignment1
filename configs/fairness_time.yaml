# Fairness check: does IGA-String catch up when it gets more evaluations?
# Under an equal evaluation budget an SA run takes longer than an IGA-String run (Small
# testbed: up to 1.32 times at m = 2). Here IGA-String also runs with 35% more evaluations,
# which more than covers that difference.
# Small testbed sizes, 5 instances per size: 2025 runs, about 25 min with 4 workers.
output_dir: results/fairness_time
workers: 4

instances:
  dir: data/COSP_Flow_Shop
  ids: [10, 11, 12, 13, 14]
  groups:
    - {n: [3, 4, 5], o: [2, 3, 4], m: [2, 3, 6]}

budget:
  max_full_evals: 190000

seeds: [1, 2, 3, 4, 5]

algorithms:
  SA:
    type: sa
    params: {init: neh, p0: 0.3, t_ratio: 0.001, p_insert: 0.6, p_swap: 0.3}
  IGA-String:
    type: iga_string
    params: {gamma: 20000, z: 2.0}
  IGA-String +35%:
    type: iga_string
    params: {gamma: 20000, z: 2.0}
    budget: {max_full_evals: 256500}   # replaces the experiment-wide budget for this entry
